name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:bridge
      - run: npm run test:bridge-package
      - uses: actions/upload-artifact@v4
        with:
          name: pi-edge-plugin
          path: |
            main.js
            manifest.json
            styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: pi-edge-bridge
          path: dist/pi-edge-bridge.tgz
